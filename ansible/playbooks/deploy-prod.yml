---
- name: Verify production inventory
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Require exactly one configured production host
      ansible.builtin.assert:
        that:
          - groups.get('app', []) | length == 1
        fail_msg: "Production inventory must contain exactly one host."

- name: Verify production deployment prerequisites
  hosts: app
  gather_facts: true
  any_errors_fatal: true

  tasks:
    - name: Require the correct production server
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - ansible_hostname == "fiveops-production"
          - (fiveops_environment | default('')) == "production"
        fail_msg: "Production target verification failed."

    - name: Require an immutable production image
      ansible.builtin.assert:
        that:
          - (app_digest | default('')) is match('^ghcr\.io/fiveops-bcu/support-app@sha256:[a-f0-9]{64}$')
          - (app_version | default('')) is match('^[a-f0-9]{7,40}$')
        fail_msg: "Production image digest or version is missing."

- name: Execute shared deployment
  ansible.builtin.import_playbook: deploy.yml
