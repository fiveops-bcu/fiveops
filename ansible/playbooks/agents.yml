
---
- name: Install monitoring agents
  hosts: app
  become: true

  tasks:
    - name: Install Prometheus Node Exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Enable and start Node Exporter
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
