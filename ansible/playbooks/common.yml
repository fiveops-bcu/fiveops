---
- name: Configure common server baseline
  hosts: all
  become: true

  pre_tasks:
    - name: Require explicit deployment public key
      ansible.builtin.assert:
        that:
          - deploy_public_key_file is defined
          - (deploy_public_key_file | default('')) is match('^/.+[.]pub$')
        fail_msg: "Supply an approved absolute public-key path. No default key is permitted."

    - name: Read selected public key
      ansible.builtin.set_fact:
        fiveops_deploy_public_key: "{{ lookup('ansible.builtin.file', deploy_public_key_file) | trim }}"
      no_log: true

    - name: Validate public key format
      ansible.builtin.assert:
        that:
          - fiveops_deploy_public_key.splitlines() | length == 1
          - fiveops_deploy_public_key is match('^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp(256|384|521)) [A-Za-z0-9+/]+={0,2}( .*)?$')
        fail_msg: "An OpenSSH public key is required."
      no_log: true

    - name: Validate public key fingerprint
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -lf
          - "{{ deploy_public_key_file }}"
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      become: false
      check_mode: false
      changed_when: false

  tasks:
    - name: Install Docker and SSH packages
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
          - openssh-server
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create deployment user
      ansible.builtin.user:
        name: deploy
        shell: /bin/bash
        create_home: true
        groups: docker
        append: true
        state: present

    - name: Create deployment SSH directory
      ansible.builtin.file:
        path: /home/deploy/.ssh
        state: directory
        owner: deploy
        group: deploy
        mode: "0700"

    - name: Authorise Jenkins deployment key
      ansible.builtin.lineinfile:
        path: /home/deploy/.ssh/authorized_keys
        create: true
        line: "{{ fiveops_deploy_public_key }}"
        owner: deploy
        group: deploy
        mode: "0600"
