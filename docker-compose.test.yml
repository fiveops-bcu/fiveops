# Runs every test against a real PostgreSQL, the same way on a laptop and in Jenkins
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test        # throwaway test database, not a real secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      retries: 15

  tests:
    image: python:3.12-slim
    working_dir: /src
    volumes: ["./:/src"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@db:5432/test
      PYTHONDONTWRITEBYTECODE: "1"
      COVERAGE_FILE: /tmp/.coverage
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install -q -r requirements-dev.txt && mkdir -p reports &&
      pytest -p no:cacheprovider --junitxml=reports/junit.xml
      --cov=app --cov-report=xml:reports/coverage.xml --cov-fail-under=80;
      status=$$?; chmod -R a+rwX reports; exit $$status"
